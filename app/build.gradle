plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.reomusic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.reomusic'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation 'androidx.media3:media3-datasource:1.7.1'
    implementation 'androidx.media3:media3-database:1.7.1'

    implementation 'com.github.TeamNewPipe:NewPipeExtractor:0.26.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Lightweight image loading for album art / thumbnails
    implementation 'io.coil-kt:coil:2.6.0'

    // Coroutines (used throughout MainActivity / PlaybackService)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
